name: BUSify CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (OxLint)
        run: npm run lint

      - name: Run production build (Vite)
        run: npm run build

  backend:
    name: Backend (Tests & Validation)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:///./busify.db
      JWT_SECRET: "ci-test-jwt-secret-key-at-least-32-chars-long-for-testing"
      STUDENT_HASH_SALT: "ci-test-student-hash-salt-32-chars-minimum"
      TRANSPORT_OFFICER_PASSWORD: "ci-transport-officer-password-1234"
      ADMIN_PASSWORD: "ci-admin-password-1234"
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap synthetic college transit dataset
        run: python -m backend.app.core.data.synthetic_generator

      - name: Run pytest test suite
        run: pytest backend/app/tests/ -v --tb=short

