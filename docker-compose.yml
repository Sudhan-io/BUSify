# BUSify Production Docker Compose
# ============================================================
# Services:
#   osrm     — Self-hosted OSRM routing engine (Tamil Nadu OSM data)
#   backend  — FastAPI application via Gunicorn+Uvicorn workers
#   frontend — React production build served via Nginx
#
# PREREQUISITES (run once before docker-compose up):
#   See osrm-setup.sh in this directory for OSM data download + graph build.
# ============================================================

version: "3.9"

services:

  # ── OSRM Routing Engine ────────────────────────────────────────────────────
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: busify_osrm
    restart: unless-stopped
    volumes:
      # Mount the pre-processed OSRM graph files (generated by osrm-setup.sh)
      - ./osrm_data:/data
    command: >
      osrm-routed
      --algorithm mld
      --max-table-size 1000
      /data/karnataka-kerala-tamil-nadu.osrm
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/route/v1/driving/77.9546,10.9549;77.9600,10.9600?overview=false"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - busify_net

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: busify_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override OSRM URL to use docker-compose internal network name
      OSRM_BASE_URL: "http://osrm:5000"
      ENABLE_OFFLINE_HAVERSINE_FALLBACK: "False"
      DATABASE_URL: "sqlite:////app/data/busify.db"
    volumes:
      # Persist SQLite database across container restarts
      # Switch to external PostgreSQL volume in production
      - busify_db_data:/app/data
    depends_on:
      osrm:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - busify_net

  # ── React Frontend (Nginx static serve) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: busify_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"   # SSL termination via Nginx (configure certs in frontend/nginx.conf)
    depends_on:
      - backend
    networks:
      - busify_net

volumes:
  busify_db_data:
    driver: local

networks:
  busify_net:
    driver: bridge
